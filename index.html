/* ============================================================

:root{
  --sage:        #9ecab8;  /* Principal */
  --sage-oscuro: #6aaa94;  /* Hover / borde */
  --sage-claro:  #daf0e8;  /* Fondos verdes */

  --beige-claro: #f5e9d0;  /* Fondos cálidos */
  --gris:        #7a7a7a;  /* Logotipo / texto secundario */
  --crema:       #f5f3ef;  /* Fondo base */
  --carbon:      #3a3a3a;  /* Texto principal */
  --blanco:      #ffffff;
  --radio: 16px;
  --sombra: 0 2px 10px rgba(58,58,58,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{

  background:var(--crema);
  color:var(--carbon);

}
h1,h2,h3{font-family:'Nunito',sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none}

/* ---------- ENCABEZADO ---------- */
header{background:var(--crema);padding:28px 16px 18px;text-align:center}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
.logo-icono{

  border:2.5px solid var(--sage);
  display:flex;align-items:center;justify-content:center;
  background:var(--blanco);
}
.logo-icono svg{width:28px;height:28px;stroke:var(--gris)}
.wordmark{font-family:'Nunito',sans-serif;font-weight:800;font-size:34px;color:var(--gris);letter-spacing:-.5px}
.tagline{color:var(--gris);font-size:14px;margin-top:4px}

}
.btn-filtros{

.btn-filtros:hover{background:var(--sage-claro)}
.btn-filtros .num{

.btn-filtros.activo .num{display:inline-block}
select.orden{

.contador{margin-left:auto;font-size:13px;color:var(--gris);font-weight:600;white-space:nowrap}

.panel-filtros{max-width:1100px;margin:0 auto;padding:6px 16px 14px;display:none}

.chip:hover{border-color:var(--sage)}

.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(58,58,58,.10)}

.slides::-webkit-scrollbar{display:none} /* Chrome/Safari */
.slide{

@media (prefers-reduced-motion: reduce){

  html{scroll-behavior:auto}

/* ============================================================
   CARGA DE DATOS
   ============================================================ */
async function cargarDatos(){
  if(CONFIG.SHEET_CSV_URL){
    try{
      // El parámetro de tiempo evita que el navegador sirva una copia vieja:
      // así, en cuanto cambias una celda del Sheet, la mamá ve el cambio.
      const sep = CONFIG.SHEET_CSV_URL.includes("?") ? "&" : "?";
      const res = await fetch(CONFIG.SHEET_CSV_URL + sep + "t=" + Date.now());
      productos = parsearCSV(await res.text());
    }catch(e){
      console.error("No se pudo leer el Sheet, usando ejemplo:", e);
      productos = EJEMPLO;
    }
  }else{
    productos = EJEMPLO;
  }
  productos = productos.map(normalizar);
  construirChips();
  leerURL();      // aplica los filtros que vengan en el link
  render();
}

/* Parser de CSV: respeta comillas y comas internas */
function parsearCSV(texto){
  const filas = [];
  let fila = [], celda = "", enComillas = false;
  for(let i=0;i<texto.length;i++){
    const c = texto[i];
    if(enComillas){
      if(c === '"' && texto[i+1] === '"'){celda+='"';i++;}
      else if(c === '"'){enComillas=false;}
      else celda+=c;
    }else{
      if(c === '"') enComillas=true;
      else if(c === ',') {fila.push(celda);celda="";}
      else if(c === '\n'){fila.push(celda);filas.push(fila);fila=[];celda="";}
      else if(c !== '\r') celda+=c;
    }
  }
  if(celda||fila.length){fila.push(celda);filas.push(fila);}
  const cab = filas.shift().map(h=>h.trim().toLowerCase());
  return filas.filter(f=>f.join("").trim()!=="").map(f=>{
    const obj = {};
    cab.forEach((h,i)=>obj[h]=(f[i]||"").trim());
    return normalizar(obj);
  });
}

/* ============================================================
   NORMALIZACION
   [REVISAR] es una marca interna de trabajo del inventario.
   Nunca debe llegar a la pantalla de una clienta.
   ============================================================ */
function normalizar(p){
  p.estado = (p.estado||"").trim().toLowerCase();
  p.nombre = (p.nombre||"").replace(/\[REVISAR\]\s*/g,"").trim() || "Prenda";
  p.categoria = (p.categoria||"").startsWith("[") ? "" : (p.categoria||"");
  p.condicion = (p.condicion||"").startsWith("[") ? "" : (p.condicion||"");
  p.precio = parseFloat(p.precio)||0;
  p.precio_antes = parseFloat(p.precio_antes)||0;
  return p;
}

/* ============================================================
   COMPUERTA DE VISIBILIDAD
   Un solo lugar decide qué se publica. Si algún día quieres
   mostrar también los borradores, cambia CONFIG.ESTADOS_VISIBLES.
   ============================================================ */
function esVisible(p){
  return CONFIG.ESTADOS_VISIBLES.includes((p.estado||"").trim().toLowerCase());
}

/* ¿La pieza tiene promoción válida? */
function enOferta(p){ return p.precio_antes > p.precio && p.precio > 0; }

/* ============================================================
   FILTROS ⇄ URL
   La URL siempre refleja los filtros activos, así Mike puede
   filtrar, copiar el link y mandarlo a quien quiera.
   Ejemplo: catalogo.html?talla=0-3m,3-6m&genero=nina&oferta=1
   ============================================================ */
const PARAMS = ["talla","categoria","genero","condicion","precio","temporada"];

function leerURL(){
  try{
  const q = new URLSearchParams(location.search);
  PARAMS.forEach(clave=>{
    const val = q.get(clave);
    if(!val) return;
    val.split(",").forEach(v=>{
      // el filtro de precio viaja como slug (0-150), lo demás tal cual
      if(clave==="precio"){
        const r = RANGOS.find(x=>x.slug===v.trim());
        if(r) filtros.precio.add(r.etq);
      }else{
        filtros[clave].add(v.trim());
      }
    });
  });
  soloOferta = q.get("oferta")==="1";
  const orden = q.get("orden");
  if(["reciente","menor","mayor"].includes(orden)) document.getElementById("orden").value = orden;

  // Marcar visualmente los chips que vienen activos desde la URL
  document.querySelectorAll(".chips[data-filtro] .chip").forEach(ch=>{
    const clave = ch.closest(".chips").dataset.filtro;
    if(filtros[clave].has(ch.dataset.valor)) ch.classList.add("on");
  });
  document.getElementById("chipOferta").classList.toggle("on", soloOferta);

  // Si el link trae filtros, abrir el panel para que se vean
  const hayFiltros = PARAMS.some(k=>filtros[k].size) || soloOferta;
  if(hayFiltros){
    document.getElementById("panelFiltros").classList.add("abierto");
    document.getElementById("btnFiltros").setAttribute("aria-expanded","true");
  }
  }catch(e){
    /* Entorno restringido: arrancamos sin filtros desde URL */
  }
}

function escribirURL(){
  // En vistas previas embebidas (como la de Claude) el navegador
  // bloquea history.replaceState. El try/catch evita que eso
  // tumbe el catálogo: la URL simplemente no se actualiza ahí,
  // pero en el hosting real funciona normal.
  try{
    const q = new URLSearchParams();
    PARAMS.forEach(clave=>{
      if(!filtros[clave].size) return;
      const vals = [...filtros[clave]].map(v=>{
        if(clave==="precio"){
          const r = RANGOS.find(x=>x.etq===v);
          return r ? r.slug : v;
        }
        return v;
      });
      q.set(clave, vals.join(","));
    });
    if(soloOferta) q.set("oferta","1");
    const orden = document.getElementById("orden").value;
    if(orden!=="reciente") q.set("orden", orden);
    const nueva = q.toString() ? `?${q.toString()}` : location.pathname;
    history.replaceState(null,"",nueva);
  }catch(e){
    /* Entorno restringido: seguimos sin actualizar la URL */
  }
}

/* ============================================================
   CHIPS DE FILTRO
   ============================================================ */
function construirChips(){
  const visibles = productos.filter(esVisible);
  const valores = {
    talla: ORDEN_TALLAS.filter(t=>visibles.some(p=>p.talla===t)),
    categoria: [...new Set(visibles.map(p=>p.categoria))].filter(c=>c && !c.startsWith("[")).sort(),
    genero: ["nina","nino","unisex"].filter(g=>visibles.some(p=>p.genero===g)),
    condicion: ["nuevo con etiqueta","nuevo sin etiqueta","seminuevo","usado bueno"].filter(c=>visibles.some(p=>p.condicion===c)),
    precio: RANGOS.map(r=>r.etq),
    temporada: ["calor","frio","neutro"].filter(t=>visibles.some(p=>p.temporada===t))
  };
  const bonito = v => ({nina:"niña",nino:"niño",frio:"frío"})[v] || v;
  document.querySelectorAll(".chips[data-filtro]").forEach(cont=>{
    const clave = cont.dataset.filtro;
    cont.innerHTML = "";
    valores[clave].forEach(v=>{
      const b = document.createElement("button");
      b.className = "chip";
      b.dataset.valor = v;
      b.textContent = bonito(v);
      b.onclick = ()=>{
        filtros[clave].has(v) ? filtros[clave].delete(v) : filtros[clave].add(v);
        b.classList.toggle("on");
        render();
      };
      cont.appendChild(b);
    });
  });
}

function pasaFiltros(p){
  if(soloOferta && !enOferta(p)) return false;
  if(filtros.talla.size && !filtros.talla.has(p.talla)) return false;
  if(filtros.categoria.size && !filtros.categoria.has(p.categoria)) return false;
  if(filtros.genero.size && !filtros.genero.has(p.genero)) return false;
  if(filtros.condicion.size && !filtros.condicion.has(p.condicion)) return false;
  if(filtros.temporada.size && !filtros.temporada.has(p.temporada)) return false;
  if(filtros.precio.size){
    const enRango = [...filtros.precio].some(etq=>{
      const r = RANGOS.find(x=>x.etq===etq);
      return p.precio > r.min - 0.01 && p.precio <= r.max;
    });
    if(!enRango) return false;
  }
  return true;
}

/* ============================================================
   RENDER
   ============================================================ */
function esNuevo(p){
  const dias = (Date.now() - new Date(p.fecha_alta+"T12:00:00")) / 86400000;
  return dias <= CONFIG.DIAS_NUEVO;
}

/* Arma el carrusel de un producto: fotos reales o 3 placeholders */
function htmlCarrusel(p){
  const urls = (p.fotos||"").split(",").map(u=>u.trim()).filter(Boolean).slice(0,3);
  let slides, n;
  if(urls.length){
    n = urls.length;
    slides = urls.map((u,i)=>
      `<div class="slide"><img src="${u}" alt="${p.nombre} — foto ${i+1}" ${i?'loading="lazy"':''}
         onerror="this.parentElement.classList.add('ph-1');this.remove();"></div>`
    ).join("");
  }else{
    // Sin fotos aún: 3 slides de muestra para ver el carrusel funcionando
    n = 3;
    slides = [1,2,3].map(i=>
      `<div class="slide ph-${i}"><span class="emoji" aria-hidden="true">${EMOJI[p.categoria]||"👶"}</span></div>`
    ).join("");
  }
  const dots = n>1
    ? `<div class="dots">${Array.from({length:n},(_,i)=>`<span class="dot ${i===0?"on":""}"></span>`).join("")}</div>`
    : "";
  return `<div class="slides" data-carrusel>${slides}</div>${dots}`;
}

function render(){
  escribirURL(); // la URL siempre refleja la vista actual

  const grid = document.getElementById("grid");
  const orden = document.getElementById("orden").value;

  // Solo se muestra lo aprobado (disponible / apartado).
  // Borradores, vendidos y archivo quedan fuera automáticamente.
  let lista = productos.filter(p=>esVisible(p) && pasaFiltros(p));

  if(orden==="menor") lista.sort((a,b)=>a.precio-b.precio);
  else if(orden==="mayor") lista.sort((a,b)=>b.precio-a.precio);
  else lista.sort((a,b)=>new Date(b.fecha_alta)-new Date(a.fecha_alta));

  const disp = lista.filter(p=>p.estado==="disponible").length;
  document.getElementById("contador").innerHTML =
    `<strong>${disp}</strong> ${disp===1?"pieza disponible":"piezas disponibles"}`;

  const n = Object.values(filtros).reduce((s,set)=>s+set.size,0) + (soloOferta?1:0);
  const btn = document.getElementById("btnFiltros");
  document.getElementById("numFiltros").textContent = n;
  btn.classList.toggle("activo", n>0);

  if(!lista.length){
    grid.innerHTML = `<div class="vacio"><span class="emoji">🍃</span>
      <p>No hay piezas con esos filtros</p>
      <span>Prueba quitando alguno — el inventario cambia cada semana.</span></div>`;
    return;
  }

  grid.innerHTML = lista.map(p=>{
    const oferta = enOferta(p);
    const desc = oferta ? Math.round((1 - p.precio/p.precio_antes)*100) : 0;
    const badges = [
      esNuevo(p) && p.estado==="disponible" ? `<span class="badge badge-nuevo">Nuevo</span>` : "",
      p.estado==="apartado" ? `<span class="badge badge-apartado">Apartado</span>` : ""
    ].join("");
    return `
    <article class="card ${p.estado==="apartado"?"apartado":""}">
      <div class="foto">
        ${htmlCarrusel(p)}
        <div class="badges">${badges}</div>
      </div>
      <div class="info">
        <div class="nombre">${p.nombre}</div>
        <div class="detalles">${[p.condicion,p.marca].filter(Boolean).join(" · ")}</div>
        <div class="precio-fila">
          <div class="precio-bloque">
            <div class="precio-linea">
              <span class="precio">$${p.precio.toLocaleString("es-MX")}</span>
              ${oferta?`<span class="badge-desc">−${desc}%</span>`:""}
            </div>
            ${oferta?`<span class="precio-antes">Antes: $${p.precio_antes.toLocaleString("es-MX")}</span>`:""}
          </div>
          <span class="talla-pill">${p.talla}</span>
        </div>
        ${p.estado==="apartado"
          ? `<button class="btn-quiero" disabled>Apartado 💛</button>`
          : `<button class="btn-quiero" onclick="loQuiero('${p.id}')">Lo quiero</button>`}
      </div>
    </article>`;
  }).join("");

  activarCarruseles();
}

/* Actualiza el puntito activo cuando la mamá hace swipe */
function activarCarruseles(){
  document.querySelectorAll("[data-carrusel]").forEach(slides=>{
    const dots = slides.parentElement.querySelectorAll(".dot");
    if(!dots.length) return;
    let tick = false;
    slides.addEventListener("scroll", ()=>{
      if(tick) return;
      tick = true;
      requestAnimationFrame(()=>{
        const i = Math.round(slides.scrollLeft / slides.clientWidth);
        dots.forEach((d,j)=>d.classList.toggle("on", j===i));
        tick = false;
      });
    }, {passive:true});
  });
}

/* ============================================================
   BOTÓN "LO QUIERO" → DM de Instagram
   Instagram no permite pre-llenar mensajes, así que copiamos
   el texto al portapapeles y abrimos el DM: pegar y enviar.
   ============================================================ */
/* Copia texto al portapapeles con doble respaldo:
   1) API moderna  2) textarea oculto (método clásico)
   Devuelve true si se logró copiar. */
async function copiarTexto(txt){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(txt);
      return true;
    }
  }catch(e){ /* pasa al respaldo */ }
  try{
    const ta = document.createElement("textarea");
    ta.value = txt;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

async function loQuiero(id){
  const p = productos.find(x=>x.id===id);
  const msj = `Hola! Me interesa ${p.nombre} (${p.id}) que vi en el catálogo 💚`;
  const abrirDM = ()=>window.open(`https://ig.me/m/${CONFIG.INSTAGRAM_USER}`,"_blank");
  const copiado = await copiarTexto(msj);
  if(copiado){
    toast("Mensaje copiado ✓ pégalo en el DM");
    setTimeout(abrirDM, 900);
  }else{
    abrirDM();
  }
}

function toast(txt){
  const t = document.getElementById("toast");
  t.textContent = txt;
  t.classList.add("ver");
  setTimeout(()=>t.classList.remove("ver"), 2600);
}

/* ============================================================
   EVENTOS
   ============================================================ */
document.getElementById("btnFiltros").onclick = function(){
  const panel = document.getElementById("panelFiltros");
  const abierto = panel.classList.toggle("abierto");
  this.setAttribute("aria-expanded", abierto);
};
document.getElementById("orden").onchange = render;
document.getElementById("chipOferta").onclick = function(){
  soloOferta = !soloOferta;
  this.classList.toggle("on", soloOferta);
  render();
};
document.getElementById("limpiar").onclick = ()=>{
  Object.values(filtros).forEach(s=>s.clear());
  soloOferta = false;
  document.querySelectorAll(".chip.on").forEach(c=>c.classList.remove("on"));
  render();
};
/* Copiar el link con los filtros actuales — para mandarlo por DM */
document.getElementById("copiarVista").onclick = async ()=>{
  const ok = await copiarTexto(location.href);
  toast(ok ? "Link copiado ✓ mándalo por DM"
           : "No se pudo copiar — copia la URL del navegador");
};

cargarDatos();
</script>
